name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q MaterialYouKeyboard (1).zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: MaterialYouKeyboard (1)
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialYouKeyboard-debug
          path: MaterialYouKeyboard (1)/app/build/outputs/apk/debug/app-debug.apk
