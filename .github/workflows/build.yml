name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q "MaterialYouKeyboard (1).zip" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: project/MaterialYouKeyboard (1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialYouKeyboard-debug
          path: project/MaterialYouKeyboard (1)/app/build/outputs/apk/debug/app-debug.apk
